# BerryAPI script style (improvement 75).
#
# A formatter config so a script author's editor and CI agree on layout. Run
# `stylua .` (or the `make lint-scripts` target) to check. The lint rules
# themselves live in .luaurc; this is formatting only.
column_width = 100
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
